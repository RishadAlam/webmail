<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 518" role="img" aria-labelledby="title"><title id="title">Copy the service address — illustrative example</title><rect width="760" height="518" fill="#f6f8fc"/><g font-family="system-ui, sans-serif" fill="#1f1f1f"><text x="28" y="42" font-size="24" font-weight="600">Copy the service address</text><text x="28" y="70" font-size="15" fill="#444746">Illustrative example · not a live provider screenshot</text><rect x="24" y="92" width="712" height="120" rx="8" fill="white" stroke="#dadce0"/><text x="44" y="120" font-size="13" fill="#444746">IN CLOUDFLARE</text><text x="44" y="152" font-size="20" font-weight="600">Your Worker → Settings → Domains &amp; Routes</text><text x="44" y="183" font-size="16" fill="#444746">Find the enabled address for the deployed receiving service.</text><rect x="24" y="228" width="712" height="120" rx="8" fill="white" stroke="#dadce0"/><text x="44" y="256" font-size="13" fill="#444746">PASTE INTO WEBMAIL</text><text x="44" y="288" font-size="20" font-weight="600">Incoming mail service address</text><text x="44" y="319" font-size="16" fill="#444746">https://webmail-ingress.your-account.workers.dev</text><rect x="24" y="364" width="712" height="120" rx="8" fill="white" stroke="#dadce0"/><text x="44" y="392" font-size="13" fill="#444746">LEAVE OUT</text><text x="44" y="424" font-size="20" font-weight="600">Dashboard links and extra paths</text><text x="44" y="455" font-size="16" fill="#444746">Do not include /webhooks/resend in this field.</text></g></svg>