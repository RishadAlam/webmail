<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 518" role="img" aria-labelledby="title"><title id="title">One password, two places — illustrative example</title><rect width="760" height="518" fill="#f6f8fc"/><g font-family="system-ui, sans-serif" fill="#1f1f1f"><text x="28" y="42" font-size="24" font-weight="600">One password, two places</text><text x="28" y="70" font-size="15" fill="#444746">Illustrative example · not a live provider screenshot</text><rect x="24" y="92" width="712" height="120" rx="8" fill="white" stroke="#dadce0"/><text x="44" y="120" font-size="13" fill="#444746">START IN YOUR PASSWORD MANAGER</text><text x="44" y="152" font-size="20" font-weight="600">Generate and save one random password</text><text x="44" y="183" font-size="16" fill="#444746">At least 32 characters, without spaces. Keep it private.</text><rect x="24" y="228" width="712" height="120" rx="8" fill="white" stroke="#dadce0"/><text x="44" y="256" font-size="13" fill="#444746">CLOUDFLARE WORKER</text><text x="44" y="288" font-size="20" font-weight="600">Type: Secret   ·   Name: INGRESS_SECRET</text><text x="44" y="319" font-size="16" fill="#444746">Value: paste your generated password, then deploy.</text><rect x="24" y="364" width="712" height="120" rx="8" fill="white" stroke="#dadce0"/><text x="44" y="392" font-size="13" fill="#444746">WEBMAIL CONNECTIONS</text><text x="44" y="424" font-size="20" font-weight="600">Incoming mail password</text><text x="44" y="455" font-size="16" fill="#444746">Paste the exact same password here, then save.</text></g></svg>