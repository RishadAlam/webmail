<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" role="img" aria-labelledby="title"><title id="title">How your mail travels — illustrative example</title><rect width="760" height="382" fill="#f6f8fc"/><g font-family="system-ui, sans-serif" fill="#1f1f1f"><text x="28" y="42" font-size="24" font-weight="600">How your mail travels</text><text x="28" y="70" font-size="15" fill="#444746">Illustrative example · not a live provider screenshot</text><rect x="24" y="92" width="712" height="120" rx="8" fill="white" stroke="#dadce0"/><text x="44" y="120" font-size="13" fill="#444746">RECEIVING</text><text x="44" y="152" font-size="20" font-weight="600">Sender → Cloudflare → WebMail</text><text x="44" y="183" font-size="16" fill="#444746">The Cloudflare Worker receives and holds incoming mail.</text><rect x="24" y="228" width="712" height="120" rx="8" fill="white" stroke="#dadce0"/><text x="44" y="256" font-size="13" fill="#444746">SENDING</text><text x="44" y="288" font-size="20" font-weight="600">WebMail → Resend → Recipient</text><text x="44" y="319" font-size="16" fill="#444746">Resend sends messages from your authorized email address.</text></g></svg>