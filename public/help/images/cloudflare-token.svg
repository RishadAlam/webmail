<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 518" role="img" aria-labelledby="title"><title id="title">Allow reading your domain settings — illustrative example</title><rect width="760" height="518" fill="#f6f8fc"/><g font-family="system-ui, sans-serif" fill="#1f1f1f"><text x="28" y="42" font-size="24" font-weight="600">Allow reading your domain settings</text><text x="28" y="70" font-size="15" fill="#444746">Illustrative example · not a live provider screenshot</text><rect x="24" y="92" width="712" height="120" rx="8" fill="white" stroke="#dadce0"/><text x="44" y="120" font-size="13" fill="#444746">PERMISSION 1</text><text x="44" y="152" font-size="20" font-weight="600">Zone  →  Zone  →  Read</text><text x="44" y="183" font-size="16" fill="#444746">Lets WebMail find your domain.</text><rect x="24" y="228" width="712" height="120" rx="8" fill="white" stroke="#dadce0"/><text x="44" y="256" font-size="13" fill="#444746">PERMISSION 2</text><text x="44" y="288" font-size="20" font-weight="600">Zone  →  DNS  →  Read</text><text x="44" y="319" font-size="16" fill="#444746">Lets WebMail read its domain records.</text><rect x="24" y="364" width="712" height="120" rx="8" fill="white" stroke="#dadce0"/><text x="44" y="392" font-size="13" fill="#444746">ZONE RESOURCES</text><text x="44" y="424" font-size="20" font-weight="600">Include  →  Specific zone  →  your domain</text><text x="44" y="455" font-size="16" fill="#444746">Choose the same mail domain configured in WebMail.</text></g></svg>