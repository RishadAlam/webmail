ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 45
KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 50
GracefulShutdownTimeout 25
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 2
    MaxRequestWorkers 2
    MaxConnectionsPerChild 500
</IfModule>
