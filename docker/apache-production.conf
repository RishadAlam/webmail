ServerName localhost
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php
    <Directory /var/www/html>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    # No URI, query string, referrer, cookie or request body in access logs.
    LogFormat "%h %t \"%m\" %>s %b" private
    CustomLog /proc/self/fd/1 private
</VirtualHost>
